<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Tiffany van Hooijdonk</title>
  <!-- Google Fonts for Editorial Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Montserrat:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
  
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background-color: #F5F1EB;
      color: #4A151B;
      font-family: 'Montserrat', sans-serif;
      font-weight: 300;
      line-height: 1.7;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    ::selection {
      background: #4A151B;
      color: #F5F1EB;
    }

    .container {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 5vw;
    }

    /* ----------------------------------------------------
       NAVIGATIE
       ---------------------------------------------------- */
    .nav-intro-section {
      padding: 8vh 0 4vh 0;
    }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(74, 21, 27, 0.15);
      padding-bottom: 1.8rem;
      font-size: 1.1rem;
      letter-spacing: 0.05em;
    }

    .nav-left-wrapper {
      display: flex;
      align-items: center;
      gap: 3.5rem;
    }

    .nav-brand {
      display: flex;
      align-items: center;
    }

    .nav-logo {
      height: 38px;
      width: auto;
      display: block;
      mix-blend-mode: multiply;
      transition: opacity 0.3s ease;
    }

    .nav-logo:hover {
      opacity: 0.8;
    }

    .nav-left {
      display: flex;
      gap: 4rem;
    }

    .nav-item {
      color: #4A151B;
      text-decoration: none;
      font-family: 'Montserrat', sans-serif;
      font-weight: 400;
      font-size: 1rem;
      cursor: pointer;
      position: relative;
      transition: opacity 0.3s ease;
    }

    .nav-item:hover {
      opacity: 0.75;
    }

    .nav-item.active {
      font-weight: 500;
    }

    .nav-item.active::after {
      content: '';
      position: absolute;
      bottom: -1.8rem;
      left: 0;
      width: 100%;
      height: 2px;
      background-color: #4A151B;
    }

    .nav-right .nav-item {
      opacity: 0.85;
    }

    /* ----------------------------------------------------
       CONTACT SECTION (Conform contact page.png)
       ---------------------------------------------------- */
    .contact-section {
      min-height: calc(75vh - 100px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 8vh 0 10vh 0;
      gap: 5vh;
    }

    .contact-main-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin: 0 auto;
    }

    .contact-title {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(2.2rem, 4.5vw, 3.6rem);
      font-weight: 400;
      font-style: italic;
      color: #4A151B;
      margin-bottom: 2.2rem;
      letter-spacing: -0.01em;
      line-height: 1.25;
    }

    .contact-email-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      font-size: 1rem;
    }

    .contact-icon {
      width: 24px;
      height: 24px;
      object-fit: contain;
      flex-shrink: 0;
      display: block;
      mix-blend-mode: multiply;
    }

    .contact-email-link {
      color: #4A151B;
      text-decoration: underline;
      text-underline-offset: 3px;
      font-family: 'Montserrat', sans-serif;
      font-style: italic;
      font-size: 0.95rem;
      transition: opacity 0.3s ease;
    }

    .contact-email-link:hover {
      opacity: 0.75;
    }

    /* Bottom row: Telefoon (links) & LinkedIn (rechts) */
    .contact-bottom-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      padding-top: 2rem;
      gap: 3rem;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.95rem;
      font-style: italic;
      color: #4A151B;
      text-decoration: none;
      transition: opacity 0.3s ease;
    }

    .contact-item-link {
      color: #4A151B;
      text-decoration: none;
      font-style: italic;
      cursor: pointer;
      transition: opacity 0.3s ease;
    }

    .contact-item-link:hover {
      opacity: 0.75;
    }

    .contact-item-text {
      font-style: italic;
      color: #4A151B;
    }

    /* ----------------------------------------------------
       RESPONSIVE ADJUSTMENTS
       ---------------------------------------------------- */
    @media (max-width: 900px) {
      .nav-left {
        gap: 2rem;
      }
      .nav-left-wrapper {
        gap: 2rem;
      }
    }

    @media (max-width: 768px) {
      .contact-section {
        min-height: auto;
        padding: 6vh 0 8vh 0;
        gap: 4rem;
      }
      .contact-bottom-row {
        flex-direction: column;
        align-items: center;
        gap: 1.8rem;
        padding-top: 4vh;
      }
    }

    @media (max-width: 600px) {
      .nav-bar {
        font-size: 0.9rem;
      }
      .nav-logo {
        height: 30px;
      }
      .nav-left {
        gap: 1.2rem;
      }
      .nav-left-wrapper {
        gap: 1.2rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- NAVIGATIEBAR -->
    <section class="nav-intro-section">
      <nav class="nav-bar">
        <div class="nav-left-wrapper">
          <div class="nav-brand">
            <a href="index.html" aria-label="Terug naar homepage">
              <img src="logo.png" alt="Tiffany van Hooijdonk Logo" class="nav-logo">
            </a>
          </div>
          <div class="nav-left">
            <a href="index.html#mijn-projecten" class="nav-item">Mijn projecten</a>
            <a href="over-mij.html" class="nav-item">Over mij</a>
          </div>
        </div>
        <div class="nav-right">
          <a href="contact.html" class="nav-item active">Contact</a>
        </div>
      </nav>
    </section>

    <!-- CONTACT INHOUD (Conform contact page.png) -->
    <main class="contact-section">
      
      <!-- Centraal: Titel & E-mail -->
      <div class="contact-main-wrapper">
        <h1 class="contact-title">Een idee? Vertel!</h1>

        <div class="contact-email-wrapper">
          <img src="mail icoon.svg" alt="E-mail icoon" class="contact-icon">
          <a href="mailto:tif.hooijdonk@gmail.com" class="contact-email-link">tif.hooijdonk@gmail.com</a>
        </div>
      </div>

      <!-- Onderzijde: Telefoonnummer (links) & LinkedIn (rechts) -->
      <div class="contact-bottom-row">
        <!-- Telefoonnummer linksonder -->
        <div class="contact-item">
          <img src="telefoon icoon.svg" alt="Telefoon icoon" class="contact-icon">
          <a href="tel:+31681100552" class="contact-item-link">+31 6 81 10 05 52</a>
        </div>

        <!-- LinkedIn rechtsonder (klikbaar naar profiel) -->
        <a href="https://www.linkedin.com/in/tiffany-van-hooijdonk-ba28b827a?utm_source=share_via&utm_content=profile&utm_medium=member_ios" target="_blank" rel="noopener noreferrer" class="contact-item contact-item-link">
          <img src="persoon icoon.svg" alt="LinkedIn icoon" class="contact-icon">
          <span class="contact-item-text">LinkedIn - Tiffany van Hooijdonk</span>
        </a>
      </div>

    </main>

  </div>

</body>
</html>
